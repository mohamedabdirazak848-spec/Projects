version: '3'
services: 
   my-app:
      image: 580982411240.dkr.ecr.eu-west-2.amazonaws.com/my-app:Version_1
      ports:
      - 3000:3000
   mongodb: 
      image: mongo:7.0
      ports:
      - 27017:27017
      environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
   mongo-express:
      image: mongo-express 
      ports:
      - 8081:8081
      restart: always 
      environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
      - ME_CONFIG_MONGODB_ADMINPASSWORD=password
      - ME_CONFIG_MONGODB_SERVER=mongodb
